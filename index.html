::selection{background:rgba(170,190,255,.38);color:inherit}
::-moz-selection{background:rgba(170,190,255,.38);color:inherit}
a{color:inherit}

.wrap{max-width:980px;margin:0 auto;padding:0 28px}

.bar{position:relative;display:flex;align-items:center;gap:14px;min-height:60px}
.brand{font-weight:600;text-decoration:none;font-size:15.5px;white-space:nowrap;flex:none;transition:color .25s ease}

.links a.on{color:var(--ink)}

.lang{display:flex;gap:2px}

h2{font-size:22px;line-height:1.3;font-weight:600;margin:0;padding-top:2px}
h3{font-size:17px;margin:0;font-weight:600}
.lead{font-size:21px;line-height:1.55;color:var(--muted);max-width:52ch;margin:0 0 32px}
.intro{color:var(--muted);margin:0 0 28px;max-width:56ch}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:11px 20px;border-radius:8px;border:1px solid var(--line);text-decoration:none;font-weight:500;font-size:15px;transition:background .2s,border-color .2s,box-shadow .2s}

.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}

.tags{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:15px;display:flex;gap:6px 28px;flex-wrap:wrap}

.item p{margin:2px 0 0;color:var(--muted);font-size:16px}
.sub{font-size:14.5px;color:var(--muted);margin:32px 0 10px}
.sub:first-child{margin-top:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:3px 12px;border:1px solid var(--line);border-radius:999px;font-size:14.5px}
.video-card{width:100%;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;transition:none}
.video-card:hover{border-color:transparent;box-shadow:none}
.video-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 11px}
.video-kicker{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:10.5px;line-height:1.4;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.video-mark{width:6px;height:6px;border-radius:50%;background:#737b88;flex:none}
.video-format{display:inline-flex;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10.5px;line-height:1.2;letter-spacing:.02em;white-space:nowrap}
.video-frame{overflow:visible;position:relative;aspect-ratio:auto;border-radius:0;background:transparent}
.video-player{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#111318;border:0;border-radius:12px;object-fit:contain;accent-color:#111827;box-shadow:0 8px 24px rgba(17,24,39,.12)}
.video-player:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
@media(max-width:520px){.video-head{padding:0 0 9px}.video-kicker,.video-format{font-size:9.5px}.video-player{border-radius:999px;box-shadow:0 6px 18px rgba(17,24,39,.1)}}
.note{font-size:14px;color:var(--muted);margin:12px 0 0}
#accueil .home-social{margin-top:26px}
.contact-links{display:flex;flex-wrap:wrap;align-items:center;gap:24px}
.contact-link{display:inline-flex;align-items:center;gap:5px;min-height:0;padding:4px 0;border:0;border-radius:0;background:transparent;color:var(--muted);font:500 15px "Instrument Sans",sans-serif;text-align:left;text-decoration:none;cursor:pointer;box-shadow:none;transition:color .2s ease}
.contact-link:hover{background:transparent;color:var(--ink);box-shadow:none}
.contact-link:focus-visible{outline-offset:4px}
.contact-link svg{width:20px;height:20px;flex:none;color:currentColor;opacity:.86}
.email-rotator{display:inline-grid;grid-template-areas:"email";text-align:left;height:1.45em;line-height:1.45;overflow:hidden;vertical-align:middle}
.email-label,.email-address{grid-area:email;white-space:nowrap;transition:transform .42s cubic-bezier(.22,.8,.25,1),opacity .28s ease}
.email-label{transform:translateY(0);opacity:1}
.email-address{transform:translateY(110%);opacity:0}
.email-trigger.revealed .email-label{transform:translateY(-110%);opacity:0}
.email-trigger.revealed .email-address{transform:translateY(0);opacity:1}
.social-area{margin-top:0}
.toast{min-height:20px;margin:8px 0 0;color:var(--muted);font-size:12.5px;opacity:0;transform:translateY(4px);transition:opacity .25s ease,transform .25s ease}

 .links a{font-size:13.5px}
 .row{grid-template-columns:minmax(0,1fr)}

var L=function(p){return p[lang==="fr"?0:1]};
function pills(id,a){document.getElementById(id).innerHTML=a.map(function(x){return'<span class="pill">'+L(x)+'</span>'}).join("")}
function items(id,a){document.getElementById(id).innerHTML=a.map(function(x){return'<div class="item"><div class="k">'+L(x[0])+'</div><div><h3>'+L(x[1])+'</h3><p>'+L(x[2])+'</p></div></div>'}).join("")}
var cur="brand";
var languageTransition=false,languageChangeTimer=null,pendingLanguage=lang;
var isManualScrolling=false, manualScrollTimer=null;
var navElement=document.getElementById("links");
var barElement=document.querySelector(".bar");
var brandElement=document.querySelector(".brand");

function buildNav(){
 navElement.innerHTML=NAV.map(function(n){return'<a href="#'+n[0]+'" data-s="'+n[0]+'">'+L(n[1])+'</a>'}).join("");
}

function moveIndicator(){
 var indicator=barElement.querySelector(".nav-indicator");
 var active=(cur==="brand")?brandElement:navElement.querySelector('a[data-s="'+cur+'"]');
 if(!active||!indicator)return;
 var barRect=barElement.getBoundingClientRect();
 var targetRect=active.getBoundingClientRect();
 indicator.style.width=targetRect.width+"px";
 indicator.style.top=(targetRect.bottom-barRect.top+2)+"px";
 indicator.style.transform="translate3d("+(targetRect.left-barRect.left)+"px,0,0)";
}

function spy(id){
 if(id==="accueil"||id==="brand"){cur="brand";}
 else if(NAV.some(function(n){return n[0]===id})){cur=id;}
 else{return;}
 brandElement.classList.toggle("on",cur==="brand");
 if(cur==="brand")brandElement.setAttribute("aria-current","location");else brandElement.removeAttribute("aria-current");
 navElement.querySelectorAll("a[data-s]").forEach(function(a){var active=a.dataset.s===cur;a.classList.toggle("on",active);if(active)a.setAttribute("aria-current","location");else a.removeAttribute("aria-current")});
 moveIndicator();
}

function render(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=L(S[e.dataset.i])});
 if(!navElement.querySelector("a[data-s]"))buildNav();
 NAV.forEach(function(n){var a=navElement.querySelector('a[data-s="'+n[0]+'"]');if(a&&a.textContent!==L(n[1]))a.textContent=L(n[1])});
 ["stList","inList","ceList","spList","caGoal","caNext"].forEach(function(k){items(k,D[k])});
 document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.l===lang))});
 
 /* Mise à jour dynamique des liens LinkedIn en fonction de la langue */
 document.querySelectorAll(".linkedin-link").forEach(function(link){
  link.href = linkedinLinks[lang] || linkedinLinks["en"];
 });

 spy(cur);
}

function changeLanguage(next){
 if(next===lang&&!languageTransition)return;
 pendingLanguage=next;
 languageTransition=true;
 document.body.classList.add("lang-changing");
 clearTimeout(languageChangeTimer);
 languageChangeTimer=setTimeout(function(){
  lang=pendingLanguage;
  render();
  requestAnimationFrame(function(){requestAnimationFrame(function(){
   moveIndicator();
   document.body.classList.remove("lang-changing");
   setTimeout(function(){languageTransition=false;},360);
  })});
 },130);
}

document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){changeLanguage(b.dataset.l)})});

navElement.addEventListener("click",function(event){
 var a=event.target.closest("a[data-s]");
 if(a){
  isManualScrolling=true;
  spy(a.dataset.s);
  clearTimeout(manualScrollTimer);
  manualScrollTimer=setTimeout(function(){
   isManualScrolling=false;
  }, 800);
 }
});

brandElement.addEventListener("click",function(){
 isManualScrolling=true;
 spy("brand");
 clearTimeout(manualScrollTimer);
 manualScrollTimer=setTimeout(function(){
  isManualScrolling=false;
 }, 800);
});

var io=new IntersectionObserver(function(es){
 if(languageTransition || isManualScrolling) return;
 es.forEach(function(e){if(e.isIntersecting)spy(e.target.id)});
},{rootMargin:"-30% 0px -60% 0px"});

document.querySelectorAll("main section").forEach(function(s){io.observe(s)});

document.querySelectorAll(".email-trigger").forEach(function(emailButton){
 var toast=emailButton.closest(".social-area").querySelector(".toast"),toastTimer;
 emailButton.addEventListener("click",function(){
  var email="leoartlebb@gmail.com";
  emailButton.classList.add("revealed");
  var copyPromise;
  if(navigator.clipboard&&navigator.clipboard.writeText){copyPromise=navigator.clipboard.writeText(email)}
  else{copyPromise=new Promise(function(resolve,reject){try{var ta=document.createElement("textarea");ta.value=email;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();ok?resolve():reject()}catch(e){reject(e)}})}
  Promise.resolve(copyPromise).then(function(){toast.textContent=lang==="fr"?"Adresse e-mail copiée dans le presse-papiers.":"Email address copied to clipboard.";toast.classList.add("show")}).catch(function(){toast.textContent=lang==="fr"?"Adresse e-mail : leoartlebb@gmail.com":"Email address: leoartlebb@gmail.com";toast.classList.add("show")});
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.classList.remove("show")},2800);
 });
});

function revealNavigation(){
 if(window.scrollY<=2 && !isManualScrolling)spy("brand");
}
window.addEventListener("scroll",revealNavigation,{passive:true});
window.addEventListener("resize",moveIndicator);
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(moveIndicator)}
render();
revealNavigation();
})();
</script>
</body>
</html>
